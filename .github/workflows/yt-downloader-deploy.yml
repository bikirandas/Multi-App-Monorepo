name: Deploy yt-downloader.exe to S3

on:
  push:
    branches: [main]
    paths:
      - "YT-Downloader/**"
      - "infrastructure/modules/yt-downloader/**"
      - ".github/workflows/yt-downloader-deploy.yml"
  workflow_dispatch:

env:
  # Target S3 bucket (created by the terraform module in
  # infrastructure/modules/yt-downloader)
  BUCKET_NAME: boxndots-products-prod

  # AWS region
  AWS_REGION: ap-south-1

  # The versioned file name (yt-downloader-v<version>.exe) is read from
  # app/version.py at runtime and exported as EXE_NAME in the build step.

  # IAM role assumed by GitHub Actions to deploy to AWS
  DEPLOY_ROLE_ARN: arn:aws:iam::593271843865:role/Boxndots-website-deployment-role

  # Terraform module directory (relative to repository root)
  TERRAFORM_DIR: infrastructure/modules/yt-downloader

jobs:
  build-and-deploy:
    name: Build yt-downloader.exe and deploy infrastructure
    runs-on: windows-latest
    environment: production
    # id-token: write is required to assume the IAM role via OIDC
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 1. Build the executable
      # ------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyqt6 yt-dlp

      # Reads app/version.py and exports EXE_NAME (e.g. yt-downloader-v1.0.0)
      # for the build, the verify step and the Terraform steps.
      - name: Read application version
        working-directory: YT-Downloader
        run: |
          $version = python -c "from app.version import __version__; print(__version__)"
          Write-Host "Application version: $version"
          "EXE_NAME=yt-downloader-v$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Writes the Windows version resource from app/version.py so the .exe's
      # File/Product version always matches the version shown in the app.
      - name: Generate version info for the executable
        working-directory: YT-Downloader
        run: python scripts/make_version_info.py version_info.txt

      - name: Build executable with PyInstaller
        working-directory: YT-Downloader
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ${{ env.EXE_NAME }} `
            --version-file version_info.txt `
            --icon app/icons/yt-downloader-icon.ico `
            --add-data "app/icons/yt-downloader-icon.png;app/icons" `
            --add-binary "app/bin/ffmpeg.exe;app/bin" `
            --add-binary "app/bin/ffprobe.exe;app/bin" `
            run.py

      - name: Verify the executable was built
        run: |
          Get-ChildItem -Path YT-Downloader/dist/${{ env.EXE_NAME }}.exe

      # ------------------------------------------------------------------
      # 2. Deploy infrastructure with Terraform (creates bucket + uploads exe)
      # ------------------------------------------------------------------
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.3
          # The wrapper captures Terraform's stdout, which can hide all output    # in the job log. Turn it off so terraform prints directly.
          terraform_wrapper: false


      - name: Configure AWS credentials (assume deployment role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Fails loudly here if the OIDC trust or role is wrong, instead of
      # letting later Terraform steps silently not run.
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init

      - name: Terraform validate
        working-directory: ${{ env.TERRAFORM_DIR }}
        env:
          TF_LOG: DEBUG
          AWS_LOG_LEVEL: debug
          AWS_SDK_VERBOSE: true
        run: terraform validate

      - name: Terraform plan (preview changes)
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform plan `
            -var "executable_source_path=${{ github.workspace }}/YT-Downloader/dist/${{ env.EXE_NAME }}.exe" `
            -var "object_key=Youtube-Downloader/${{ env.EXE_NAME }}.exe"

      - name: Terraform apply (create bucket and upload exe)
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform apply -auto-approve `
            -var "executable_source_path=${{ github.workspace }}/YT-Downloader/dist/${{ env.EXE_NAME }}.exe" `
            -var "object_key=Youtube-Downloader/${{ env.EXE_NAME }}.exe"

      - name: Show deployment outputs
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform output
